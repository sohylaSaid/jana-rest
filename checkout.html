<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Jana Restaurant - Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🛒 Checkout</h1>

    <h3 id="customerName"></h3>


    <div class="checkout-box">

        <h2>Your Order</h2>

        <ul id="checkoutList"></ul>

        <h2 id="checkoutTotal"></h2>

    </div>



    <form id="checkoutForm">

        <h2>Customer Information</h2>

        <br>

        <label>Full Name</label>

        <input type="text" id="fullName" placeholder="Enter your full name" required >

        <br>
        <br>

        <label>
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
        >

        <br>
        <br>

        <label>
            Address
        </label>

        <input
            type="text"
            id="address"
            placeholder="Enter your address"
            required
        >

        <br>
        <br>

        <label>
            Payment Method
        </label>

        <br>
        <br>

        <select id="payment" required>

            <option value="">
                Choose payment method
            </option>

            <option value="Cash">
                💵 Cash
            </option>

            <option value="Credit Card">
                💳 Credit Card
            </option>

            <option value="Vodafone Cash">
                📱 Vodafone Cash
            </option>

            

        </select>

        <br>
        <br>

        <button type="submit">
            ✅ Complete Order
        </button>

    </form>


    <h2 id="success"></h2>


    <script src="checkout.js"></script>

</body>

</html>
