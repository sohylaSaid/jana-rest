<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jana Restaurant - Order</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Jana Restaurant</h1>

    <h3 id="message"></h3>

    <br>

    <form>

        <label>
            <h2>Please choose your food</h2>
        </label>

        <button id="fc" type="button">🍗 Fried Chicken (40$)</button>
        <button id="fr" type="button">🍟 Fries (20$)</button>
        <button id="to" type="button">🌮 Tacos (50$)</button>
        <button id="su" type="button">🍣 Sushi (60$)</button>
        <button id="bu" type="button">🍔 Burger (30$)</button>
        <button id="pi" type="button">🍕 Pizza (30$)</button>

    </form>

    <ul id="orderlist">
    </ul>

    <h3 id="type"></h3>

    <button id="checkout" type="button">
        🛒 Checkout
    </button>

    <script src="order.js"></script>

</body>
</html>
